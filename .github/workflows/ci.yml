name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  lib: libfff_c.so,    jdk-arch: x64,     docker-platform: linux/amd64 }
          - { name: linux-arm64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, lib: libfff_c.so,    jdk-arch: aarch64, docker-platform: linux/arm64 }
          - { name: darwin-arm64, os: macos-14,         target: aarch64-apple-darwin,      lib: libfff_c.dylib, jdk-arch: aarch64 }
          - { name: darwin-x64,   os: macos-14,         target: x86_64-apple-darwin,       lib: libfff_c.dylib, jdk-arch: x64, rosetta: true }
          - { name: windows-x64, os: windows-latest,  target: x86_64-pc-windows-msvc,   lib: fff_c.dll,        jdk-arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Pin fff source (single truth - resources/FFF_SOURCE)
        shell: bash
        run: |
          src=$(tr -d '[:space:]' < resources/FFF_SOURCE)
          echo "FFF_REPO=$(echo "$src" | cut -d@ -f1)" >> "$GITHUB_ENV"
          echo "FFF_REF=$(echo "$src" | cut -d@ -f2)" >> "$GITHUB_ENV"
      - name: Checkout fff source (${{ env.FFF_REF }})
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FFF_REPO }}
          ref: ${{ env.FFF_REF }}
          path: fff-src
      - name: Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build (fff-c)
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fff-src
          key: ${{ matrix.target }}-${{ env.FFF_REF }}
      - name: Build fff-c (release, cdylib)
        if: runner.os != 'Linux'
        working-directory: fff-src
        run: cargo build --locked --release -p fff-c --target ${{ matrix.target }}
      - name: Build fff-c (Linux, glibc 2.31 baseline)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.docker-platform }}" \
            -v "$PWD/fff-src:/work" -w /work \
            -e RUSTUP_TOOLCHAIN=1.91.1 \
            rust:1.91.1-bullseye \
            cargo build --locked --release -p fff-c --target "${{ matrix.target }}"
      - name: Stage library
        shell: bash
        run: |
          mkdir -p resources/prebuilds/${{ matrix.name }}
          cp "fff-src/target/${{ matrix.target }}/release/${{ matrix.lib }}" \
            "resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}"
      - name: Check Linux glibc ceiling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          lib="resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}"
          max_glibc="$(readelf --version-info "$lib" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          echo "highest required glibc symbol: $max_glibc"
          test "$(printf '%s\n' "$max_glibc" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
      - name: Install Rosetta 2 (darwin-x64 cross test)
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: ${{ matrix.jdk-arch }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Run tests against real fff-c
        run: clojure -X:test
      - name: Build jar
        run: clojure -T:build jar
